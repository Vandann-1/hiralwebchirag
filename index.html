<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hiral &amp; Chirag — Royal Wedding Invitation</title>
  <meta name="description" content="Royal Wedding Invitation of Hiral &amp; Chirag. Together with the blessings of our families, we joyfully invite you to celebrate our wedding.">
  <meta name="theme-color" content="#120C06">

  <meta property="og:title" content="Hiral &amp; Chirag — Royal Wedding Invitation">
  <meta property="og:description" content="We joyfully invite you to celebrate the wedding of Hiral &amp; Chirag on 11-12 February 2027.">
  <meta property="og:image" content="assets/images/royal-envelope-cover.jpg">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="assets/images/hc-monogram.svg">
  <link rel="apple-touch-icon" href="assets/images/hc-monogram.svg">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Ambient Backdrop -->
  <div class="desktop-backdrop"></div>

  <!-- Main Viewport Application Shell -->
  <main id="invitation-app" role="region" aria-label="Hiral &amp; Chirag Royal Wedding Invitation">

    <!-- Interactive Particle Overlay (Gold Dust & Sparkles) -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- ROYAL RED EMBOSSED ENVELOPE (4-SIDE OPENING WITH LUXURY UX/UI EXPERIENCE) -->
    <div id="royal-envelope-screen" class="royal-envelope-screen" role="button" tabindex="0" aria-label="Tap Royal Seal to Open Envelope">
      <div class="envelope-3d-wrapper" id="envelope-3d-wrapper">
        <!-- Back Wall / Inside Velvet Lining of the Envelope -->
        <div class="envelope-inside-lining">
          <div class="envelope-lining-pattern"></div>
          <div class="envelope-lining-gold-border"></div>
        </div>

        <!-- The Royal Invitation Card Inside that Reveals and Elevates -->
        <div class="envelope-sliding-card" id="envelope-sliding-card">
          <img src="assets/images/scene-1-ganesh.jpg" alt="Ganesh Stapan Invitation" class="sliding-card-img">
          <div class="card-ambient-glow"></div>
        </div>

        <!-- 4-SIDE ROYAL FLAPS (All 4 unfold outward in 3D) -->
        <!-- 1. Left Flap -->
        <div class="envelope-flap envelope-flap-left" id="envelope-flap-left">
          <img src="assets/images/royal-envelope-clean-base.jpg" alt="Royal Envelope Left Flap" class="envelope-img">
        </div>

        <!-- 2. Right Flap -->
        <div class="envelope-flap envelope-flap-right" id="envelope-flap-right">
          <img src="assets/images/royal-envelope-clean-base.jpg" alt="Royal Envelope Right Flap" class="envelope-img">
        </div>

        <!-- 3. Bottom Flap -->
        <div class="envelope-flap envelope-flap-bottom" id="envelope-flap-bottom">
          <img src="assets/images/royal-envelope-clean-base.jpg" alt="Royal Envelope Bottom Flap" class="envelope-img">
        </div>

        <!-- 4. Top Flap -->
        <div class="envelope-flap envelope-flap-top" id="envelope-flap-top">
          <img src="assets/images/royal-envelope-clean-base.jpg" alt="Royal Envelope Top Flap" class="envelope-img">
        </div>

        <!-- Gold Seam Crease Lines between the 4 Flaps -->
        <div class="envelope-crease-lines" id="envelope-crease-lines"></div>

        <!-- Official H&C Center Medallion Badge -->
        <div class="envelope-badge-trigger" id="envelope-badge-trigger" title="Tap Royal Seal to Open">
          <!-- Concentric Ring Ring Ring Pulsating Waves on Proper Center -->
          <div class="badge-pulse-ring ring-1"></div>
          <div class="badge-pulse-ring ring-2"></div>
          <div class="badge-pulse-ring ring-3"></div>

          <img src="assets/images/envelope-badge.png" alt="H&amp;C Royal Monogram Badge" class="envelope-center-badge-img">
          <div class="badge-gold-aura"></div>
          <div class="badge-shimmer-ring"></div>
        </div>

        <!-- Tap Prompt Pill -->
        <div class="envelope-tap-pill" id="envelope-tap-pill">
          <span class="tap-icon">✨</span>
          <span>Tap Royal Seal to Open</span>
        </div>
      </div>
    </div>

    <!-- INVITATION CARDS STAGE & STORY PROGRESS BARS -->
    <div class="cards-stage-container" id="cards-stage-container" style="display: none;">

      <!-- Luxury Story-Style Progress Bars (11s duration per ceremony) -->
      <div class="story-progress-header" id="story-progress-header" aria-label="Ceremony Story Progress">
        <div class="story-bar-segment" data-target="1" title="Card 1: Ganesh Stapan"><div class="story-bar-fill fill-active" style="animation-duration: 11000ms;"></div></div>
        <div class="story-bar-segment" data-target="2" title="Card 2: Family Invitation"><div class="story-bar-fill fill-empty"></div></div>
        <div class="story-bar-segment" data-target="3" title="Card 3: Haldi Ceremony"><div class="story-bar-fill fill-empty"></div></div>
        <div class="story-bar-segment" data-target="4" title="Card 4: Mameru"><div class="story-bar-fill fill-empty"></div></div>
        <div class="story-bar-segment" data-target="5" title="Card 5: H&C Palace"><div class="story-bar-fill fill-empty"></div></div>
        <div class="story-bar-segment" data-target="6" title="Card 6: Hast Milap Lagan"><div class="story-bar-fill fill-empty"></div></div>
      </div>

      <!-- Minimal Floating Corner Music Toggle -->
      <button class="minimal-music-btn" id="minimal-music-btn" aria-label="Toggle Wedding Music" title="Toggle Wedding Music">
        <div class="music-bars is-muted" id="music-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </button>

      <!-- Minimal Left Arrow -->
      <button class="minimal-nav-arrow arrow-left" id="btn-prev-card" aria-label="Previous Card" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
      </button>

      <!-- Minimal Right Arrow -->
      <button class="minimal-nav-arrow arrow-right" id="btn-next-card" aria-label="Next Card">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /></svg>
      </button>

      <!-- 6 Clean Ceremony Cards -->
      <div class="clean-cards-slider" id="clean-cards-slider">

        <!-- CARD 1: GANESH STAPAN -->
        <div class="invitation-card-slide slide-active" data-scene="1">
          <img src="assets/images/scene-1-ganesh.jpg" alt="Ganesh Stapan Ceremony" class="card-artwork-image">
        </div>

        <!-- CARD 2: FAMILY INVITATION -->
        <div class="invitation-card-slide slide-future" data-scene="2">
          <img src="assets/images/scene-2-invitation.jpg" alt="Hiral &amp; Chiragkumar Invitation" class="card-artwork-image">
        </div>

        <!-- CARD 3: HALDI CEREMONY -->
        <div class="invitation-card-slide slide-future" data-scene="3">
          <img src="assets/images/scene-3-haldi.jpg" alt="Haldi Ceremony" class="card-artwork-image">
        </div>

        <!-- CARD 4: MAMERU -->
        <div class="invitation-card-slide slide-future" data-scene="4">
          <img src="assets/images/scene-4-mameru.jpg" alt="Mameru Ceremony" class="card-artwork-image">
        </div>

        <!-- CARD 5: H&C MONOGRAM PALACE -->
        <div class="invitation-card-slide slide-future" data-scene="5">
          <img src="assets/images/scene-5-hc-palace.jpg" alt="H&amp;C Monogram Palace" class="card-artwork-image">
        </div>

        <!-- CARD 6: HAST MILAP FINALE -->
        <div class="invitation-card-slide slide-future" data-scene="6">
          <img src="assets/images/scene-6-hast-milap.jpg" alt="Hast Milap Lagan Finale" class="card-artwork-image">
          <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

          <div class="finale-clean-actions interactive-action">
            <button class="clean-action-pill pill-replay" id="btn-replay-envelope" title="Replay Envelope">
              <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" /></svg>
              Replay
            </button>
            <button class="clean-action-pill" id="btn-download-ics" title="Add to Calendar">
              <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z" /></svg>
              Calendar
            </button>
            <button class="clean-action-pill" id="btn-open-location" title="Google Maps Location">
              <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" /></svg>
              Location
            </button>
            <button class="clean-action-pill" id="btn-share-invite" title="Share on WhatsApp">
              <svg viewBox="0 0 24 24"><path d="M16.75 13.96c.25.13.41.2.46.3.06.11.04.61-.21 1.18-.25.56-1.23 1.1-1.74 1.12-.46.02-.91.01-2.96-.8-2.49-.99-4.08-3.52-4.2-3.69-.13-.16-1-1.33-1-2.54 0-1.21.63-1.81.86-2.05.23-.24.5-.3.67-.3.17 0 .34 0 .49.01.16.01.37-.06.57.44.22.53.74 1.82.81 1.95.07.13.11.29.02.47-.09.18-.14.29-.27.45-.14.15-.29.35-.41.47-.14.13-.28.27-.12.54.16.27.71 1.17 1.52 1.89 1.04.93 1.92 1.22 2.19 1.35.27.14.43.12.59-.07.16-.18.69-.8 88-1.08.18-.27.37-.23.62-.14zM12 2a10 10 0 0 0-8.6 15.09L2 22l5.05-1.33A10 10 0 1 0 12 2z" /></svg>
              Share
            </button>
          </div>
        </div>

      </div>

    </div>

    <!-- Native Audio Element -->
    <audio id="wedding-audio" loop preload="auto" playsinline>
      <source src="assets/audio/wedding-soundtrack.mp3?v=2" type="audio/mpeg">
    </audio>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
